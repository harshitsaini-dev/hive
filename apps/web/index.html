<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page paint into the notch area; the CSS
         then uses safe-area insets so nothing important lands under it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Hive</title>
    <meta
      name="description"
      content="Manage several Gmail accounts from one place."
    />

    <!-- Tints the browser and OS chrome. Two entries so the bar matches
         whichever theme is showing. -->
    <meta
      name="theme-color"
      content="#faf7f0"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#171512"
      media="(prefers-color-scheme: dark)"
    />

    <!--
      Link previews. Absolute URLs are mandatory here — Slack, WhatsApp and
      the rest fetch these from their own servers and cannot resolve a
      relative path. Update the origin when the real domain goes live.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hive" />
    <meta property="og:title" content="Hive — manage several Gmail accounts from one place" />
    <meta
      property="og:description"
      content="Search across all your Gmail accounts at once, clear the clutter in bulk, and send from any connected identity."
    />
    <meta property="og:url" content="https://hive.harshitsaini.in/" />
    <meta property="og:image" content="https://hive.harshitsaini.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Read aloud by screen readers when the card is announced. -->
    <meta
      property="og:image:alt"
      content="Hive — manage several Gmail accounts from one place."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hive — manage several Gmail accounts from one place" />
    <meta
      name="twitter:description"
      content="Search across all your Gmail accounts at once, clear the clutter in bulk, and send from any connected identity."
    />
    <meta name="twitter:image" content="https://hive.harshitsaini.in/og-image.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iOS ignores the manifest's display mode and needs its own opt-in. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hive" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="color-scheme" content="light dark" />
    <script>
      /*
       * Catch Chrome's install prompt before anything else can miss it.
       *
       * `beforeinstallprompt` fires once, early — routinely before the app
       * bundle has parsed, let alone before React has mounted a listener in
       * an effect. Missing it is not harmless: the install button falls back
       * to showing manual instructions, so the people whose browser would
       * have installed in one click are the ones told to go hunting through
       * menus. Held here, in the head, and handed to the button when it asks.
       */
      window.__hiveInstallPrompt = null
      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__hiveInstallPrompt = event
        window.dispatchEvent(new Event('hive:installable'))
      })
      window.addEventListener('appinstalled', function () {
        window.__hiveInstallPrompt = null
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
