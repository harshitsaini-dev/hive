name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Build
        run: npm run build

  # Mirrors how Render actually installs and starts the API.
  #
  # Its own job because it installs *without* devDependencies — the same thing
  # Render does, since it sets NODE_ENV=production. Running this alongside a
  # full install would hide exactly the failures it exists to catch: a runtime
  # import that is really a devDependency, or a start command that needs a
  # build step which never ran.
  prod-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Server starts in production mode
        run: node scripts/check-prod-boot.mjs
        env:
          NODE_ENV: production
          PORT: '3999'
          WEB_ORIGIN: https://hive.example
          GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-not-a-real-secret
          GOOGLE_REDIRECT_URI: https://hive.example/auth/google/callback
          RESEND_API_KEY: ci-not-a-real-key
          TURSO_DATABASE_URL: file:./ci-boot.db
          TOKEN_ENCRYPTION_KEY: Y2ktb25seS10b2tlbi1rZXktbm90LWZvci1yZWFsICA=
          SESSION_SECRET: Y2ktb25seS1zZXNzaW9uLXNlY3JldC1ub3QtcmVhbCA=

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Dev and CI both run over TLS, because Google will not issue the
      # restricted scope to a client with an http:// redirect URI.
      - name: Generate local certificates
        run: sh scripts/make-cert.sh

      - run: npx playwright install --with-deps chromium

      - name: Migrate the test database
        run: npm run db:migrate

      # Real Google credentials are never needed in CI — nothing here talks to
      # Gmail. These exist only to satisfy boot-time config validation, and are
      # deliberately checked in: they protect nothing. Both keys must decode to
      # exactly 32 bytes or the server refuses to start.
      - name: Run Playwright suite
        run: npm run test:e2e
        env:
          CI: 'true'
          GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-not-a-real-secret
          GOOGLE_REDIRECT_URI: https://localhost:3000/auth/google/callback
          TOKEN_ENCRYPTION_KEY: Y2ktb25seS10b2tlbi1rZXktbm90LWZvci1yZWFsICA=
          SESSION_SECRET: Y2ktb25seS1zZXNzaW9uLXNlY3JldC1ub3QtcmVhbCA=

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
